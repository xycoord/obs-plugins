Invert="Invert"
KeepHueSaturation="Keep hue and saturation"
KeepHueSaturation.Help="Swaps light and dark but keeps each colour's hue and saturation: a white background turns black, black text turns white, a red logo stays red and a dark navy turns light blue. Off, it's a plain inversion and colours turn into their opposites (red becomes cyan)."
CleanUp="JPEG clean-up"
CleanUp.Help="Cleans up what JPEG does to a logo. Faint grey specks around the text turn into clean black; faint pixels next to a solid part of the logo are its smooth edges and are kept. Colour smeared along edges (JPEG keeps colour at half resolution, and inverting turns the smear into dark bands inside pale shapes) is repaired, and JPEG's ripples are calmed. Raise it if specks remain or an off-white background doesn't turn fully black. Very pale parts of a logo turn nearly black when inverted, so they can go too: lower it if they disappear. 0% turns all of this off."
Transparent="Transparent background"
Transparent.Help="Makes the black background see-through, so the logo can go over visuals or any other scene, with its edges blending smoothly. Anything that ends up black goes, including white text cut out of a shape. If a dark box is left where the background was, raise JPEG clean-up until the background is fully black. Over black it looks exactly the same as without."
SolidAbove="Fade out grey parts darker than"
SolidAbove.Help="Grey shadows and glows darker than this fade out to transparent instead of to black. Coloured parts stay solid however dark (a pale colour turns dark when inverted), so a coloured glow stays solid too. 0% keeps every part solid. Edges blend smoothly either way."
