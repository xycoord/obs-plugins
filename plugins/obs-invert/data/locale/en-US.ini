Invert="Invert"
KeepHueSaturation="Keep hue and saturation"
KeepHueSaturation.Help="Swaps light and dark but keeps each color's hue and saturation: a white background turns black, black text turns white, and a red logo stays red. Off, it's a plain inversion and colors turn into their opposites (red becomes cyan)."
CleanUp="Background clean-up"
CleanUp.Help="Turns the faint gray specks left around the text of a JPEG logo into clean black: anything darker than this becomes black, and the rest is stretched to fill the range again. Raise it if specks remain; lower it if pale parts of the logo disappear. 0% turns it off."
Transparent="Transparent background"
Transparent.Help="Makes the (now black) background see-through, so the logo can go over visuals or any other scene. Over black it looks exactly the same as without."
SolidAbove="Solid above"
SolidAbove.Help="How bright a part of the logo has to be to stay fully solid; darker parts fade out with the background. Lower it if dark parts of the logo look see-through; raise it if the edges of light text look rough over bright visuals."
