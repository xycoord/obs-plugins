Invert="Invert"
KeepHueSaturation="Keep hue and saturation"
KeepHueSaturation.Help="Swaps light and dark but keeps each color's hue and saturation: a white background turns black, black text turns white, a red logo stays red and a dark navy turns light blue. Off, it's a plain inversion and colors turn into their opposites (red becomes cyan)."
CleanUp="Background clean-up"
CleanUp.Help="Turns the faint gray specks left around the text of a JPEG logo into clean black. Faint pixels next to a solid part of the logo are its smooth edges and are kept; faint pixels with nothing brighter than this level around them are specks and go. Raise it if specks remain or an off-white background doesn't turn fully black. Very pale parts of a logo (light gray or pastel) turn nearly black when inverted, so they can go too: lower it if they disappear. 0% turns it off."
Transparent="Transparent background"
Transparent.Help="Makes the black background see-through, so the logo can go over visuals or any other scene, with its edges blending smoothly. Anything that ends up black goes, including white text cut out of a shape. If a dark box is left where the background was, raise Background clean-up until the background is fully black. Over black it looks exactly the same as without."
SolidAbove="Fade out parts darker than"
SolidAbove.Help="Parts of the logo darker than this fade out with the background, for glows and shadows. At 0% every part stays solid, however dark. Edges blend smoothly either way."
