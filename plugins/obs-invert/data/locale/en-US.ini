Invert="Invert"
KeepHueSaturation="Keep hue and saturation"
KeepHueSaturation.Help="Swaps light and dark but keeps each color's hue: a white background turns black, black text turns white, a dark navy turns light blue and a pale badge a dark one. Lightness is flipped as the eye sees it, so anything that stands out from what's next to it on the page stands out just as much after. Off, it's a plain inversion and colors turn into their opposites (red becomes cyan)."
CleanUp="JPEG clean-up"
CleanUp.Help="Cleans up what JPEG does to a logo. Faint gray specks around the text turn into clean black; faint pixels next to a solid part of the logo are its smooth edges and are kept. Color smeared along edges (JPEG keeps color at half resolution, and inverting turns the smear into dark bands inside pale shapes) is repaired, and JPEG's ripples are calmed. Raise it if specks remain or an off-white background doesn't turn fully black. Very pale parts of a logo turn nearly black when inverted, so they can go too: lower it if they disappear. 0% turns all of this off."
Transparent="Transparent background"
Transparent.Help="Makes the black background see-through, so the logo can go over visuals or any other scene, with its edges blending smoothly. Anything that ends up black goes, including white text cut out of a shape. Cream or off-white paper is taken as background too. If a dark box is still left where the background was, raise JPEG clean-up until it is fully black. Over black it looks exactly the same as without."
FadeSoft="Fade shadows and glows"
FadeSoft.Help="How far shadows, glows and other soft parts of the logo fade to transparent, as they would on the page. Solid parts stay solid however dark, and edges blend smoothly. Lower it if a textured or grainy part of a logo turns see-through; 0% keeps every part solid."
Background="Background"
Background.Auto="Automatic (from the image's edges)"
Background.Pick="This color"
Background.Help="The paper the logo was supplied on, which becomes black (or transparent). Automatic takes the color most of the image's border agrees on, if it's light. If the logo touches the edges or the paper is an unusual color, pick it here instead."
BackgroundColour="Background color"
BackgroundColour.Help="The paper's color. Use the picker's eyedropper on a plain part of the background."
EdgeSoftness="Edge softness"
EdgeSoftness.Help="How blurred the logo's edges are, in pixels. 1 for crisp artwork; raise it for a soft or enlarged logo if its edges come out with dark rims, or gray halos over visuals."
Thin="Thin lines and small text"
Thin.Auto="Automatic"
Thin.Solid="Solid"
Thin.Faint="Faint"
Thin.Help="Lines and text too thin or too blurred to tell how strong they are. Solid: they show at full strength (crisp artwork). Faint: they fade with their thinness (a blurred or shrunk logo). Automatic decides by how crisp their sides are."
GreyShadows="Dark grays can be shadows"
GreyShadows.Help="On: dark gray areas that fade gently are treated as shadows and fade to transparent. Turn it off if light gray shapes or text in the logo (dark gray once inverted) come out see-through."
