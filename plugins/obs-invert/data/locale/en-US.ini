KeepHueSaturation.Help="Swaps light and dark but keeps each color's hue: white turns black, black turns white, a dark navy turns light blue and a pale badge a dark one. Lightness is flipped as the eye sees it, so anything that stands out from what's next to it stands out just as much after. Off, it's a plain inversion and colors turn into their opposites (red becomes cyan)."
