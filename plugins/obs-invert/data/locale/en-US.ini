Invert="Invert"
KeepHueSaturation="Keep hue and saturation"
KeepHueSaturation.Help="Swaps light and dark but keeps each color's hue and saturation: a white background turns black, black text turns white, and a red logo stays red. Off, it's a plain inversion and colors turn into their opposites (red becomes cyan)."
CleanUp="Background clean-up"
CleanUp.Help="Turns the faint gray specks left around the text of a JPEG logo into clean black. A faint pixel next to a solid part of the logo is part of its smooth edge and is kept; one with nothing brighter than this level around it is a speck and goes. Raise it if specks remain; 0% turns it off."
Transparent="Transparent background"
Transparent.Help="Makes the (now black) background see-through, so the logo can go over visuals or any other scene, with its edges blending smoothly. Over black it looks exactly the same as without."
SolidAbove="Solid above"
SolidAbove.Help="Parts of the logo darker than this fade out with the background, for glows and shadows. At 0% every part stays solid, however dark. Edges always blend smoothly into what's behind."
