name: build and smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: OBS ${{ matrix.obs }} (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu's own package, and the latest release from the OBS PPA.
        obs: [ubuntu, ppa]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install OBS
        run: |
          if [ "${{ matrix.obs }}" = ppa ]; then
            sudo add-apt-repository -y ppa:obsproject/obs-studio
          fi
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq obs-studio cmake build-essential libsimde-dev \
            qt6-base-dev libpango1.0-dev xvfb xdotool imagemagick fonts-dejavu-core fonts-noto-color-emoji \
            python3-numpy python3-pil python3-websocket
          obs --version

      - name: Build and install the plugins
        run: ./install.sh

      - name: Smoke test in OBS
        run: xvfb-run -a tests/smoke.sh

      - name: Typeset Text's unit tests
        run: STRICT=1 tests/typeset/unit/run.sh

      - name: Typeset Text in OBS (scaling, editing in the preview)
        run: tests/typeset/test_typeset.py --out typeset-test-output

      - name: Keep Typeset Text's test frames and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typeset-test-output-${{ matrix.obs }}
          path: typeset-test-output
          if-no-files-found: ignore
